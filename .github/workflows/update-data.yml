name: Update college football data
on:
  workflow_dispatch:
    inputs:
      year:
        description: Season year
        default: '2026'
        required: true
  schedule:
    - cron: '23 12 * * 0,1,5'
permissions:
  contents: write
concurrency:
  group: cfb-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CFB_YEAR: ${{ inputs.year || '2026' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record attempt start
        run: python scripts/refresh_dashboard.py --begin --year "$CFB_YEAR"
      - name: Check calculations
        id: checks
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate all dashboard data
        id: fetch
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/refresh_dashboard.py --year "$CFB_YEAR"
      - name: Record refresh result
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.checks.outcome == 'success' && steps.fetch.outcome == 'success' && 'success' || 'failed' }}
          REFRESH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/refresh_dashboard.py --record "$REFRESH_OUTCOME" --year "$CFB_YEAR" --run-url "$REFRESH_RUN_URL"
      - name: Save validated data and refresh status
        if: always()
        env:
          VALIDATED: ${{ steps.checks.outcome == 'success' && steps.fetch.outcome == 'success' && 'true' || 'false' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/refresh-status.json
          if [ "$VALIDATED" = 'true' ]; then
            git add data/teams.json data/players.json data/schedule.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update dashboard data and refresh status'
            git push
          fi
